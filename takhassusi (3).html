<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>تخصصي — اكتشف تخصصك الجامعي المناسب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F7FB;
    --surface:#FFFFFF;
    --primary:#33418F;
    --primary-dark:#232D66;
    --primary-tint:#EEF0FA;
    --accent:#128C87;
    --accent-tint:#E4F5F3;
    --text:#1D2233;
    --text-muted:#666C82;
    --border:#E4E6F1;
    --danger:#B23A32;
    --success:#1E8E5A;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow:0 6px 24px rgba(35,45,102,0.08);
    --maxw:640px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Cairo',system-ui,-apple-system,sans-serif;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    max-width:var(--maxw);
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    padding-bottom:32px;
  }
  a{color:inherit;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    outline:none;
  }
  button:focus-visible, [tabindex]:focus-visible{
    outline:3px solid var(--accent);
    outline-offset:2px;
  }
  h1,h2,h3,h4,p{margin:0;}
  .container{padding:0 20px;}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:15px 22px;
    border-radius:var(--radius-md);
    font-size:16px;
    font-weight:700;
    min-height:52px;
    width:100%;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 8px 20px rgba(51,65,143,0.28);}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-accent{background:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(18,140,135,0.25);}
  .btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--border);}
  .btn-outline:hover{border-color:var(--primary);}
  .btn-ghost{background:transparent;color:var(--text-muted);width:auto;min-height:auto;padding:10px 6px;font-weight:600;}
  .btn-sm{width:auto;padding:10px 16px;min-height:40px;font-size:14px;}
  .btn[disabled]{opacity:0.4;pointer-events:none;}

  /* ---------- HOME ---------- */
  .hero{
    padding:34px 20px 10px;
    text-align:center;
  }
  .brand{
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-weight:800;font-size:15px;color:var(--primary);
    margin-bottom:22px;
    letter-spacing:0;
  }
  .brand-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
  .hero-art{width:180px;height:130px;margin:0 auto 18px;}
  .hero h1{
    font-size:28px;
    line-height:1.5;
    font-weight:800;
    color:var(--text);
  }
  .hero h1 span{color:var(--primary);}
  .hero-sub{
    margin-top:14px;
    font-size:16px;
    line-height:1.9;
    color:var(--text-muted);
    max-width:440px;
    margin-inline:auto;
  }
  .feature-row{
    display:flex;
    gap:0;
    margin:30px 20px 6px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    overflow:hidden;
  }
  .feature-item{
    flex:1;
    padding:18px 8px;
    text-align:center;
    border-inline-start:1px solid var(--border);
  }
  .feature-item:first-child{border-inline-start:none;}
  .feature-item svg{width:22px;height:22px;color:var(--accent);margin-bottom:8px;}
  .feature-item .f-num{font-weight:800;font-size:15px;color:var(--text);display:block;}
  .feature-item .f-label{font-size:12px;color:var(--text-muted);display:block;margin-top:3px;line-height:1.4;}

  .price-card{
    margin:26px 20px 0;
    background:linear-gradient(180deg,var(--primary) 0%, var(--primary-dark) 100%);
    color:#fff;
    border-radius:var(--radius-lg);
    padding:26px 22px;
    text-align:center;
  }
  .price-card .p-label{font-size:14px;opacity:0.85;font-weight:600;}
  .price-card .p-amount{font-size:28px;font-weight:800;margin:8px 0 4px;}
  .price-card .p-amount small{font-size:15px;font-weight:600;opacity:0.85;}
  .price-card .p-promo-note{font-size:13px;font-weight:700;opacity:0.85;margin-bottom:18px;}

  .resume-banner{
    margin:18px 20px 0;
    background:var(--accent-tint);
    border:1px solid #BFE6E3;
    border-radius:var(--radius-md);
    padding:16px 18px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .resume-banner p{font-size:14px;color:var(--text);line-height:1.7;}
  .resume-actions{display:flex;gap:10px;}
  .resume-actions .btn{padding:10px 12px;min-height:42px;font-size:13.5px;}

  .home-section{margin:38px 20px 0;}
  .home-section h2{font-size:19px;font-weight:800;margin-bottom:6px;}
  .home-section .sec-sub{font-size:14px;color:var(--text-muted);margin-bottom:16px;line-height:1.7;}
  .axis-list{display:flex;flex-direction:column;gap:10px;}
  .axis-row{
    display:flex;align-items:center;gap:12px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-md);padding:14px 16px;
  }
  .axis-row .a-icon{
    width:38px;height:38px;flex:none;border-radius:10px;
    background:var(--primary-tint);color:var(--primary);
    display:flex;align-items:center;justify-content:center;
  }
  .axis-row .a-icon svg{width:19px;height:19px;}
  .axis-row .a-text b{display:block;font-size:14.5px;font-weight:700;}
  .axis-row .a-text span{display:block;font-size:12.5px;color:var(--text-muted);margin-top:2px;}

  .disclaimer{
    margin:34px 20px 0;
    font-size:12.5px;color:var(--text-muted);line-height:1.9;
    background:var(--surface);border:1px dashed var(--border);
    border-radius:var(--radius-md);padding:14px 16px;
  }

  .sticky-cta{
    position:sticky; bottom:0; left:0; right:0;
    background:linear-gradient(180deg, rgba(246,247,251,0) 0%, var(--bg) 35%);
    padding:22px 20px 10px;
    margin-top:18px;
  }

  /* ---------- PAYMENT ---------- */
  .topbar{
    display:flex;align-items:center;gap:12px;
    padding:16px 20px;
  }
  .topbar .back-btn{
    width:38px;height:38px;border-radius:50%;
    background:var(--surface);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .topbar .back-btn svg{width:18px;height:18px;}
  .topbar h3{font-size:16px;font-weight:700;}

  .pay-card{
    margin:10px 20px 0;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:22px;
  }
  .pay-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:#FFF4E5;color:#8A5A00;
    font-size:12.5px;font-weight:700;
    padding:7px 12px;border-radius:100px;
    margin-bottom:16px;
  }
  .pay-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
  .pay-row:last-of-type{border-bottom:none;}
  .pay-row span:first-child{color:var(--text-muted);font-size:14px;}
  .pay-row span:last-child{font-weight:700;font-size:14px;}
  .pay-total{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;border-top:2px solid var(--border);}
  .pay-total span:first-child{font-weight:700;}
  .pay-total span:last-child{font-weight:800;font-size:20px;color:var(--primary);}
  .pay-note{
    margin:16px 20px 0;
    font-size:12.5px;line-height:1.8;color:#8A5A00;
    background:#FFF8EC;border:1px solid #F5E1B8;
    border-radius:var(--radius-sm);padding:12px 14px;
  }
  .pay-actions{margin:20px 20px 0;display:flex;flex-direction:column;gap:10px;}

  /* ---------- QUIZ ---------- */
  .quiz-header{
    position:sticky; top:0; z-index:5;
    background:var(--bg);
    padding:14px 20px 12px;
  }
  .quiz-header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .quiz-header-top .qh-count{font-size:13px;font-weight:700;color:var(--text-muted);}
  .quiz-header-top .qh-section{font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-tint);padding:5px 10px;border-radius:100px;}
  .progress-track{width:100%;height:8px;background:var(--border);border-radius:100px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:100px;transition:width .35s ease;}

  .q-card{
    margin:6px 20px 0;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:26px 20px 22px;
  }
  .q-text{font-size:18px;font-weight:700;line-height:1.8;text-align:center;margin-bottom:26px;}
  .scale{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .scale-btn{
    flex:1;
    aspect-ratio:1/1;
    border-radius:50%;
    border:2px solid var(--border);
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:16px;color:var(--text-muted);
    transition:all .15s ease;
  }
  .scale-btn.selected{
    background:var(--primary);
    border-color:var(--primary);
    color:#fff;
    transform:scale(1.08);
  }
  .scale-labels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-muted);padding:0 2px;line-height:1.5;}
  .scale-labels span{max-width:80px;}
  .scale-labels span:last-child{text-align:left;}

  .quiz-nav{display:flex;gap:10px;margin:20px 20px 0;}
  .quiz-nav .btn{width:auto;flex:1;}

  /* ---------- RESULT ---------- */
  .result-hero{padding:28px 20px 4px;text-align:center;}
  .result-hero .r-eyebrow{font-size:13px;font-weight:700;color:var(--accent);}
  .result-hero h2{font-size:22px;font-weight:800;margin-top:8px;line-height:1.6;}

  .match-card{
    margin:20px 20px 0;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .match-top{
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;
    padding:24px 22px;
    display:flex;
    align-items:center;
    gap:16px;
  }
  .match-ring{
    width:74px;height:74px;border-radius:50%;
    background:rgba(255,255,255,0.14);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    flex:none;
    border:2px solid rgba(255,255,255,0.35);
  }
  .match-ring b{font-size:19px;font-weight:800;}
  .match-ring span{font-size:9.5px;opacity:.85;}
  .match-top h3{font-size:19px;font-weight:800;}
  .match-top .match-band{font-size:13px;opacity:.9;margin-top:4px;}
  .match-top .match-cat{
    display:inline-block;margin-top:8px;font-size:11.5px;font-weight:700;
    background:rgba(255,255,255,0.18);padding:4px 10px;border-radius:100px;
  }

  .match-body{padding:20px 22px 22px;}
  .match-desc{font-size:14.5px;line-height:1.9;color:var(--text-muted);margin-bottom:18px;}

  .m-block{margin-bottom:18px;}
  .m-block h4{
    font-size:14px;font-weight:800;margin-bottom:10px;
    display:flex;align-items:center;gap:8px;
  }
  .m-block h4 svg{width:16px;height:16px;color:var(--accent);flex:none;}
  .m-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;}
  .m-list li{
    font-size:13.5px;line-height:1.7;color:var(--text);
    padding-inline-start:18px;position:relative;
  }
  .m-list li::before{
    content:"";position:absolute;right:0;top:9px;width:6px;height:6px;border-radius:50%;background:var(--accent);
  }
  .m-list.warn li::before{background:#D8912B;}
  .m-list.warn li{color:var(--text-muted);}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    font-size:12.5px;font-weight:600;background:var(--primary-tint);color:var(--primary);
    padding:7px 12px;border-radius:100px;
  }
  .study-focus-box{
    background:var(--bg);border-radius:var(--radius-sm);padding:12px 14px;
    font-size:13.5px;color:var(--text-muted);line-height:1.8;
  }

  .other-majors{margin:28px 20px 0;}
  .other-majors h3{font-size:16.5px;font-weight:800;margin-bottom:14px;}
  .minor-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:16px 16px;margin-bottom:10px;
    display:flex;align-items:center;gap:14px;
  }
  .minor-rank{
    width:34px;height:34px;border-radius:50%;background:var(--primary-tint);color:var(--primary);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none;
  }
  .minor-info{flex:1;min-width:0;}
  .minor-info b{font-size:14.5px;font-weight:700;display:block;}
  .minor-info span{font-size:12px;color:var(--text-muted);display:block;margin-top:2px;}
  .minor-pct{font-weight:800;color:var(--accent);font-size:15px;flex:none;}

  .compare-section{margin:30px 20px 0;}
  .compare-section h3{font-size:16.5px;font-weight:800;}
  .compare-section .cs-sub{font-size:13px;color:var(--text-muted);margin-top:5px;margin-bottom:16px;line-height:1.7;}
  .compare-head{display:flex;gap:10px;margin-bottom:12px;}
  .compare-head .ch-item{
    flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:14px 10px;text-align:center;
  }
  .compare-head .ch-item b{display:block;font-size:13.5px;font-weight:700;}
  .compare-head .ch-item span{display:block;font-size:11.5px;color:var(--accent);font-weight:700;margin-top:4px;}
  .compare-table{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;
  }
  .ct-row{display:flex;border-bottom:1px solid var(--border);}
  .ct-row:last-child{border-bottom:none;}
  .ct-label{
    width:96px;flex:none;padding:12px 10px;font-size:12px;font-weight:700;color:var(--text-muted);
    background:var(--bg);display:flex;align-items:center;
  }
  .ct-val{flex:1;padding:12px 10px;font-size:12.5px;line-height:1.6;display:flex;align-items:center;border-inline-start:1px solid var(--border);}

  .result-actions{margin:32px 20px 0;display:flex;flex-direction:column;gap:10px;}

  /* misc */
  .footer-note{text-align:center;font-size:11.5px;color:var(--text-muted);margin:30px 20px 10px;line-height:1.8;}
  .screen-fade{animation:fadeIn .28s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  @media (max-width:360px){
    .hero h1{font-size:24px;}
    .q-text{font-size:16.5px;}
    .scale-btn{font-size:14px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   تخصصي — Takhassusi
   تطبيق ويب من صفحة واحدة (بدون أي أدوات بناء) لمساعدة الطلاب على اكتشاف
   التخصص الجامعي الأنسب لهم عبر اختبار متعدد الأبعاد.

   ملاحظة هندسية: نظام الدفع الحالي (mockPay) هو نظام دفع تجريبي 100% لأغراض
   التطوير فقط، ولا يوجد أي خصم حقيقي. عند ربط بوابة دفع حقيقية لاحقًا، الاستبدال
   يكون فقط داخل دالة mockPay() ودالة verifyPayment() دون الحاجة لتغيير أي شيء
   آخر في التطبيق.
   ========================================================================= */

/* ----------------------------- الأبعاد (Dimensions) ----------------------------- */
const DIMENSIONS = {
  analytical:      "التحليل المنطقي",
  creative:        "الإبداع",
  technical:       "التقنية والحوسبة",
  scientific:      "العلوم الطبيعية",
  mathematical:    "الرياضيات",
  humanitarian:    "الجانب الإنساني",
  communication:   "التواصل والتعبير",
  leadership:      "القيادة",
  business:        "الأعمال وريادة المشاريع",
  detailOriented:  "الدقة والانتباه للتفاصيل",
  practical:       "الجانب العملي التطبيقي",
  language:        "اللغة والكتابة",
  caregiving:      "الرعاية ومساعدة الآخرين",
  problemSolving:  "حل المشكلات",
  criticalThinking:"التفكير النقدي"
};

/* ----------------------------- الأسئلة (48 سؤالًا) ----------------------------- */
// كل سؤال: مقياس من 1 إلى 5 (1: لا أوافق إطلاقًا ... 5: أوافق تمامًا)
// dims: الأبعاد التي يقيسها السؤال مع وزن كل بُعد
// trait (اختياري): سمة شخصية عرضية تُستخدم فقط في "لمحة شخصية" ولا تدخل في ترشيح التخصصات
const QUESTIONS = [
  // -------- المحور 1: الميول والاهتمامات --------
  {id:1,  section:"الميول والاهتمامات", text:"أستمتع بتجربة أشياء جديدة أكتشف من خلالها اهتماماتي الحقيقية.", dims:{creative:1, practical:1}},
  {id:2,  section:"الميول والاهتمامات", text:"أحب البحث عن إجابات لأسئلة تشغل بالي حتى لو لم يطلبها مني أحد.", dims:{analytical:2, scientific:1}},
  {id:3,  section:"الميول والاهتمامات", text:"أنجذب إلى المجالات التي تتعلق بمساعدة الناس وتحسين حياتهم.", dims:{humanitarian:2, caregiving:1}},
  {id:4,  section:"الميول والاهتمامات", text:"أستمتع بمتابعة أخبار التقنية والتطبيقات والاختراعات الجديدة.", dims:{technical:2}},
  {id:5,  section:"الميول والاهتمامات", text:"تستهويني فكرة الأعمال التجارية وامتلاك مشروعي الخاص مستقبلًا.", dims:{business:2, leadership:1}},
  {id:6,  section:"الميول والاهتمامات", text:"أحب القراءة والكتابة والتعبير عن أفكاري بالكلمات.", dims:{language:2, communication:1}},
  {id:7,  section:"الميول والاهتمامات", text:"أستمتع بحل الألغاز والمشكلات المعقدة التي تحتاج تفكيرًا عميقًا.", dims:{problemSolving:2, analytical:1}},
  {id:8,  section:"الميول والاهتمامات", text:"أنجذب إلى الأعمال الفنية والتصميم والجماليات البصرية.", dims:{creative:2}},

  // -------- المحور 2: طريقة التفكير --------
  {id:9,  section:"طريقة التفكير", text:"أفضّل اتخاذ القرارات بناءً على معطيات ومنطق واضح لا على الحدس فقط.", dims:{analytical:2, criticalThinking:1}},
  {id:10, section:"طريقة التفكير", text:"أستمتع بالتفكير خارج الصندوق وإيجاد حلول غير تقليدية للمشكلات.", dims:{creative:2}},
  {id:11, section:"طريقة التفكير", text:"أحب تفكيك المشكلة إلى أجزاء صغيرة لفهمها بشكل أعمق قبل حلها.", dims:{analytical:1, problemSolving:2}},
  {id:12, section:"طريقة التفكير", text:"أراجع المعلومات وأتساءل عن مصداقيتها قبل تصديقها مباشرة.", dims:{criticalThinking:2}},

/* ----------------------------- إدارة الحالة (State) ----------------------------- */
const STORAGE_KEY = "takhassusi_state_v1";

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ /* تجاهل أخطاء التخزين بصمت (مثل وضع التصفح الخاص) */ }
}

let state = loadState() || {
  screen:"home",        // home | payment | quiz | result
  answers:{},            // {questionId: 1..5}
  currentIndex:0,
  paid:false,
  finishedAt:null,
  resultCache:null
};

function resetQuiz(keepPaidStatus){
  state = {
    screen:"home",
    answers:{},
    currentIndex:0,
    paid: keepPaidStatus ? state.paid : false,
    finishedAt:null,
    resultCache:null
  };
  saveState();
  render();
}

/* ----------------------------- منطق الدفع التجريبي ----------------------------- */
// نقطة الاستبدال المستقبلية: عند توفر بوابة دفع حقيقية، استبدل محتوى mockPay
// بطلب فعلي إلى مزوّد الدفع، ثم نفّذ verifyPayment للتأكد من نجاح العملية.
function mockPay(){
  state.paid = true;
  state.screen = "quiz";
  state.currentIndex = 0;
  saveState();
  render();
}

/* ----------------------------- منطق التسجيل والتنقل ----------------------------- */
function answerQuestion(qid, value){
  state.answers[qid] = value;
  saveState();
  render();
}

function goNext(){
  if(state.currentIndex < QUESTIONS.length - 1){
    state.currentIndex++;
    saveState();
    render();
    window.scrollTo({top:0, behavior:"instant"});
  } else {
    finishQuiz();
  }
}

function goPrev(){
  if(state.currentIndex > 0){
    state.currentIndex--;
    saveState();
    render();
    window.scrollTo({top:0, behavior:"instant"});
  }
}

function finishQuiz(){
  state.resultCache = computeResults();
  state.finishedAt = Date.now();
  state.screen = "result";
  saveState();
  render();
  window.scrollTo({top:0, behavior:"instant"});
}

/* ----------------------------- محرك التسجيل والتحليل (Scoring Engine) ----------------------------- */
function computeDimensionScores(answers){
  const scores = {};
  Object.keys(DIMENSIONS).forEach(dim=>{
    let raw = 0, maxAbs = 0;
    QUESTIONS.forEach(q=>{
      const w = q.dims && q.dims[dim];
      if(!w) return;
      maxAbs += w*2; // أقصى انحراف ممكن عن المنتصف (القيمة 3) هو 2
      const val = answers[q.id];
      if(val){
        raw += w * (val - 3);
      }
    });
    let normalized = 50;
    if(maxAbs > 0){
      normalized = ((raw + maxAbs) / (2*maxAbs)) * 100;
    }
    scores[dim] = {raw, maxAbs, normalized: Math.max(0, Math.min(100, normalized))};
  });
  return scores;
}

function computeMajorMatches(dimScores){
  return MAJORS.map(major=>{
    let weightSum = 0, weighted = 0;
    Object.keys(major.dimensions).forEach(dim=>{
      const w = major.dimensions[dim];
      weightSum += w;
      weighted += w * (dimScores[dim] ? dimScores[dim].normalized : 50);
    });
    const raw = weightSum > 0 ? (weighted/weightSum) : 50;
    // تحويل النسبة الخام إلى "نسبة توافق تقديرية" أكثر واقعية بحيث لا تصل بسهولة إلى 100%
    let displayed = Math.round(12 + (raw/100) * 82);
    displayed = Math.max(8, Math.min(96, displayed));
    return {major, raw, displayed};
  }).sort((a,b)=> b.displayed - a.displayed);
}

const TRAIT_QUESTIONS = QUESTIONS.filter(q=>q.trait);
function computeTraits(answers){
  return TRAIT_QUESTIONS.map(q=>{
    const val = answers[q.id] || 3;
    let label;
    if(val >= 4) label = q.traitHigh;
    else if(val <= 2) label = q.traitLow;
    else label = "متوازن بين الاثنين";
    return {trait:q.trait, label};
  });
}

function matchBandText(pct){
  if(pct >= 90) return "توافق قوي جدًا";
  if(pct >= 75) return "توافق قوي";
  if(pct >= 60) return "توافق جيد";
  if(pct >= 45) return "توافق متوسط";
  return "توافق ضعيف نسبيًا";
}

function topDimensionsForMajor(major, dimScores, count){
  const list = Object.keys(major.dimensions).map(dim=>({
    dim, label:DIMENSIONS[dim],
    contribution: major.dimensions[dim] * (dimScores[dim] ? dimScores[dim].normalized : 50)
  }));
  list.sort((a,b)=> b.contribution - a.contribution);
  return list.slice(0, count);
}

function computeResults(){
  const dimScores = computeDimensionScores(state.answers);
  const matches = computeMajorMatches(dimScores);
  const traits = computeTraits(state.answers);
  return {dimScores, matches, traits};
}

function startFlow(){
  if(FREE_PROMOTION || state.paid){
    state.paid = true;
    state.screen = "quiz";
  } else {
    state.screen = "payment";
  }
  saveState();
  render();
}

function continueQuiz(){
  state.screen = "quiz";
  saveState();
  render();
}

function viewSavedResult(){
  state.screen = "result";
  saveState();
  render();
}

function confirmRestart(){
  if(confirm("سيتم مسح إجاباتك الحالية والبدء من جديد. هل أنت متأكد؟")){
    resetQuiz(true);
  }
}

function goHome(){

function renderQuiz(){
  const q = QUESTIONS[state.currentIndex];
  const answeredVal = state.answers[q.id];
  const pct = Math.round(((state.currentIndex) / QUESTIONS.length) * 100);
  const isLast = state.currentIndex === QUESTIONS.length - 1;

  let scaleButtons = "";
  for(let i=1;i<=5;i++){
    scaleButtons += `<button class="scale-btn ${answeredVal===i?'selected':''}" onclick="answerQuestion(${q.id}, ${i})" aria-label="${SCALE_LABELS[i-1]}">${i}</button>`;
  }

  app.innerHTML = `
    <div class="screen-fade">
      <div class="quiz-header">
        <div class="quiz-header-top">
          <span class="qh-count">السؤال ${state.currentIndex+1} من ${QUESTIONS.length}</span>
          <span class="qh-section">${q.section}</span>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>

      <div class="q-card">
        <p class="q-text">${q.text}</p>
        <div class="scale">${scaleButtons}</div>
        <div class="scale-labels"><span>${SCALE_LABELS[0]}</span><span>${SCALE_LABELS[4]}</span></div>
      </div>

      <div class="quiz-nav">
        <button class="btn btn-outline" onclick="goPrev()" ${state.currentIndex===0?'disabled':''}>السابق</button>
        <button class="btn btn-primary" onclick="goNext()" ${!answeredVal?'disabled':''}>${isLast?'عرض النتيجة':'التالي'}</button>
      </div>

      <p class="footer-note">يتم حفظ تقدمك تلقائيًا — يمكنك إغلاق الصفحة والعودة لاحقًا لإكمال الاختبار.</p>
    </div>
  `;
}

            <div class="study-focus-box">${top.major.studyFocus}</div>
          </div>

          <div class="m-block" style="margin-bottom:0;">
            <h4>${ICONS.briefcase}أمثلة على مجالات العمل مستقبلًا</h4>
            <div class="chip-row">${careersHtml}</div>
          </div>
        </div>
      </div>

      <div class="other-majors">
        <h3>تخصصات أخرى مناسبة لك</h3>
        ${othersHtml}
      </div>

      <div class="compare-section">
        <h3>محتار بين تخصصين؟</h3>
        <p class="cs-sub">مقارنة سريعة بين أفضل تخصصين ظهرا في نتيجتك لمساعدتك على الحسم.</p>
